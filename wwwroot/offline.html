<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

  <style>
    body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;background:#f7f5f0;color:#19201d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:420px;padding:30px;text-align:center}img{width:110px;height:110px;object-fit:contain}a.button{display:inline-block;border-radius:10px;padding:14px 18px;background:#9f1d20;color:#fff;font:700 16px system-ui;text-decoration:none}
  </style>
</head>
<body><main><img src="assets/feuerwehr-einhausen-logo.png" alt="Logo Feuerwehr Einhausen"><h1>Keine Internetverbindung</h1><p>Die App ist installiert, NavLog und die Kartenquellen benötigen jedoch eine Internetverbindung.</p><a class="button" href="">Erneut versuchen</a></main></body>
</html>
